name: Bibliothèque d'e-posters — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Régénère data/posters.json si des PDF ont été ajoutés
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer data/posters.json
        run: python3 scripts/generer_index.py
      - name: Commit du nouvel index (s'il a changé)
        run: |
          if ! git diff --quiet -- data/posters.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posters.json
            git commit -m "Mise à jour automatique de l'index des e-posters [skip ci]"
            git push
          fi

  # 2) Génère les vignettes d'aperçu des PDF
  vignettes:
    needs: index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer PyMuPDF
        run: pip install pymupdf
      - name: Générer les vignettes
        run: python3 scripts/generer_vignettes.py
      - name: Commit des vignettes (si nouvelles)
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/**/_vignettes/
            git commit -m "Vignettes d'aperçu des e-posters [skip ci]" || true
            git push || true
          fi

  # 3) Publie le site statique sur GitHub Pages
  deploy:
    needs: vignettes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
